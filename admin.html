<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Party Retro Chill Hub</title>
  <link rel="icon" type="image/png" href="assets/favicons/favicon-prch.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#00f5ff"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/escape.css"/>
  <style>
    .admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
    .admin-link{display:grid;gap:.55rem;border:1px solid rgba(0,245,255,.22);border-radius:8px;background:rgba(0,245,255,.045);padding:1rem;text-decoration:none;color:inherit}
    .admin-link:hover,.admin-link:focus-visible{border-color:var(--yellow);outline:none;background:rgba(255,230,0,.06)}
    .admin-link strong{font-family:'Barlow Condensed',Impact,sans-serif;font-size:1.7rem;line-height:1;color:#fff;text-transform:uppercase}
    .admin-link span{color:rgba(238,240,255,.65);line-height:1.45}
    @media (max-width:820px){.admin-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="shell">
  <div class="topline">
    <a class="nav-link" href="index.html">Dashboard</a>
    <span>PRCH // Admin</span>
    <button type="button" class="secondary" data-auth-logout>Se deconnecter</button>
  </div>

  <section class="hero">
    <h1>Admin global</h1>
    <p class="subtitle">Acces reserve au compte organisateurs.</p>
  </section>

  <section class="admin-grid" data-admin-links hidden>
    <a class="admin-link" href="admin-communications.html">
      <strong>Communications</strong>
      <span>Comptes, notifications globales et rattrapage des participants.</span>
    </a>
    <a class="admin-link" href="admin-escape.html">
      <strong>Escape</strong>
      <span>Equipes, mots de passe et progression des fragments.</span>
    </a>
    <a class="admin-link" href="admin-missions.html">
      <strong>Missions</strong>
      <span>Affectations, contenus et chats de mission.</span>
    </a>
  </section>
  <p class="notice" data-notice aria-live="polite"></p>
</main>
<script src="assets/api-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/push-config.js"></script>
<script src="assets/pwa.js"></script>
<script>
const notice = document.querySelector('[data-notice]');
const links = document.querySelector('[data-admin-links]');

function setNotice(message, isError = false){
  notice.textContent = message;
  notice.classList.toggle('is-error', isError);
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(async () => {
    const session = PRCH_AUTH.getSession();
    if(!session){
      return;
    }
    try{
      const data = await PRCH_AUTH.request('validateUserSession', {
        username: session.username,
        userToken: session.userToken
      });
      if(data.username !== 'organisateurs'){
        setNotice('Acces reserve aux organisateurs.', true);
        return;
      }
      links.hidden = false;
    }catch(error){
      setNotice(error.message, true);
    }
  }, 350);
});
</script>
</body>
</html>
