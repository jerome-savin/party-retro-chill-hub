<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signal coiffure</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07050f;color:#eef0ff;font-family:Arial,sans-serif;text-align:center;padding:2rem}
    main{max-width:620px}
    span{display:inline-block;margin-bottom:1rem;color:#ffe600;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.6rem,12vw,6rem);line-height:.95;text-transform:uppercase}
    p{margin:1rem auto 0;color:rgba(238,240,255,.76);font-size:1.1rem;line-height:1.5}
  </style>
</head>
<body>
<main>
  <span>Piste suivante</span>
  <h1>Local linge<br/>sous-sol</h1>
  <p>Le fil continue sous la surface. Descendez au sous-sol et cherchez le local linge : la prochaine information vous y attend.</p>
</main>
</body>
</html>
