name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(join(github.event.commits.*.message, ' '), '[deploy]')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PHP API config
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRCH_API_URL: ${{ secrets.PRCH_API_URL }}
          PRCH_AGENT_MODEL: ${{ secrets.PRCH_AGENT_MODEL }}
          PRCH_AGENT_FRAGMENT: ${{ secrets.PRCH_AGENT_FRAGMENT }}
          PRCH_AGENT_INSTRUCTIONS: ${{ secrets.PRCH_AGENT_INSTRUCTIONS }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          OVH_SMTP_HOST: ${{ secrets.OVH_SMTP_HOST }}
          OVH_SMTP_PORT: ${{ secrets.OVH_SMTP_PORT }}
          OVH_SMTP_SECURE: ${{ secrets.OVH_SMTP_SECURE }}
          OVH_SMTP_USERNAME: ${{ secrets.OVH_SMTP_USERNAME }}
          OVH_SMTP_PASSWORD: ${{ secrets.OVH_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: |
          mkdir -p api
          b64() { printf '%s' "$1" | base64 -w 0; }
          cat > api/config.php <<PHP
          <?php
          return [
              'openai_api_key' => base64_decode('$(b64 "$OPENAI_API_KEY")'),
              'prch_api_url' => base64_decode('$(b64 "${PRCH_API_URL:-https://script.google.com/macros/s/AKfycbzLLcmDo0bCMj-GYcdLblfkYV9v4aCwr5YB5b-ezbK6u4vgQkRUbWiQXCWJZ-nsVydo/exec}")'),
              'model' => base64_decode('$(b64 "${PRCH_AGENT_MODEL:-gpt-4.1-mini}")'),
              'fragment' => base64_decode('$(b64 "${PRCH_AGENT_FRAGMENT:-SUPPORT-2002}")'),
              'instructions' => base64_decode('$(b64 "$PRCH_AGENT_INSTRUCTIONS")'),
              'mail_api_key' => base64_decode('$(b64 "$MAIL_API_KEY")'),
              'smtp_host' => base64_decode('$(b64 "${OVH_SMTP_HOST:-ssl0.ovh.net}")'),
              'smtp_port' => (int) base64_decode('$(b64 "${OVH_SMTP_PORT:-465}")'),
              'smtp_secure' => base64_decode('$(b64 "${OVH_SMTP_SECURE:-ssl}")'),
              'smtp_username' => base64_decode('$(b64 "${OVH_SMTP_USERNAME:-organisateurs@party-retro-chill-hub.fr}")'),
              'smtp_password' => base64_decode('$(b64 "$OVH_SMTP_PASSWORD")'),
              'mail_from' => base64_decode('$(b64 "${MAIL_FROM:-organisateurs@party-retro-chill-hub.fr}")'),
              'mail_from_name' => base64_decode('$(b64 "${MAIL_FROM_NAME:-Organisateurs Party Retro Chill Hub}")'),
          ];
          PHP

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            apps-script/**
            README.md
